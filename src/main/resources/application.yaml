spring:
  web:
    error:
      include-stacktrace: never
  application:
    name: demo
  config:
    import: optional:file:.env[.properties]
  # Sqllite
  datasource:
    url: ${DB_URL}
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    show-sql: ${SHOW_SQL:false}
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:none}

jwt:
  secret: ${JWT_SECRET}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:900}
  issuer: demo

payment:
  webhook-secret: ${PAYMENT_WEBHOOK_SECRET}
  rate-limit:
    max-requests: 5
    window-seconds: 60

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.example.demo: ${APP_LOG_LEVEL:INFO}

server:
  tomcat:
    basedir: .
    accesslog:
      enabled: true
      directory: logs
      buffered: false
      pattern: "%{yyyy-MM-dd HH:mm:ss}t %m %U -> %s (%{ms}T ms)"
